name: Update profile SVGs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate SVGs
        env:
          # Classic PAT with `repo` + `read:user`. The default GITHUB_TOKEN
          # cannot see private-repo contributions, so it will not do.
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python3 today.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore: update profile stats" && git push)
